# Builds and tests the desktop app, UI and browser extensions on every push/PR to main.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['website/**', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['website/**', '.github/workflows/pages.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            extensions/package-lock.json
            ui/package-lock.json

      - name: Restore
        run: dotnet restore LocalVault.slnx --locked-mode

      - name: .NET tests
        run: dotnet run --project tests/LocalVault.Tests -c Release --no-restore

      - name: Extensions
        working-directory: extensions
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: UI
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
